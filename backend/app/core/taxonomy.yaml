      - "Rigid bottles, jugs, and tubs (PET #1, HDPE #2, PP #5) are widely recyclable."
      - "Avoid placing soft plastic bags, bubble wrap, or styrofoam in curbside recycling."
      - "Do not bag recyclables—place items loose into the recycling bin."
    notes: "Classified at the category level as plastic waste. Check the resin identification code (#1–#7) against local municipal guidelines."

  paper:
    category: "paper"
    detected_item: "paper"
