      - "Remove metal or plastic lids and recycle them separately."
      - "Paper labels can remain attached—they burn off during kiln remelting."
    disposal_tips:
      - "Clear, green, and amber food and beverage glass bottles and jars are 100% recyclable."
      - "Do NOT place broken window panes, mirrors, Pyrex bakeware, ceramics, or light bulbs in glass recycling—they have different melting points."
      - "Handle broken glass carefully; wrap non-container broken glass before placing in general waste."
    notes: "Classified at the category level as container glass."

