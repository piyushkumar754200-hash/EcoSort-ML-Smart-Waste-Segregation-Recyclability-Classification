# Common recycling mistakes for educational guidance
common_mistakes:
  - mistake: "Wishcycling plastic bags and film packaging in curbside blue bins"
    consequence: "Plastic film wraps around rotating screen axles at sorting plants, forcing facility shutdowns multiple times daily."
    correct_action: "Return clean plastic bags and wraps to grocery store drop-off bins, or place in general waste."

  - mistake: "Placing greasy takeout pizza boxes in clean paper recycling"
    consequence: "Food grease and cheese oil cannot be washed out with water during pulping, ruining entire batches of recycled paper."
    correct_action: "Tear off clean box lids for recycling; place the grease-soaked bottom half in the compost green bin or trash."

  - mistake: "Tossing lithium-ion batteries or electronics into household recycling"
    consequence: "Batteries get crushed by compactor blades, sparking violent fires inside collection trucks and sorting facilities."
    correct_action: "Always tape battery terminals and take them to a dedicated battery recycling collection bin at a hardware or electronics store."

  - mistake: "Flushing expired medicines or sanitary products down the toilet"
    consequence: "Pills poison aquatic life, while sanitary pads and wipes form massive 'fatberg' blockages in sewer pipes."
    correct_action: "Return medications to pharmacy take-back boxes; wrap sanitary pads and dispose of them in the general waste bin."

  - mistake: "Putting ceramics, mirrors, and drinking glasses into bottle recycling"
    consequence: "These glasses melt at much higher temperatures than soda-lime bottle glass, creating structural defects and weak spots in newly blown bottles."
    correct_action: "Wrap broken non-bottle glass securely in cardboard and place in general waste."

