version: "2.0.0"
disclaimer: "Disposal guidance provided by EcoSort ML is general reference advice. Local municipal recycling rules, accepted resin codes, hazardous collection events, and composting capabilities vary by jurisdiction. Never place special or hazardous waste into curbside bins."

categories:
  - plastic
  - paper
  - metal
  - glass
  - organic

recyclability_classes:
  - Recyclable
  - Compostable
  - Non-recyclable
  - Special handling

# Five primary streams matrix
primary_streams:
  plastic:
    name: "Plastic"
    category: "plastic"
    recyclability_class: "Recyclable"
    bin: "Blue Recycling Bin (Containers & Plastics)"
    badge_color: "blue"
    examples:
      - "Water bottles & beverage bottles (PET #1)"
      - "Milk jugs & detergent bottles (HDPE #2)"
      - "Rigid shampoo & lotion bottles"
      - "Food storage tubs & yogurt containers (PP #5)"
      - "Clean rigid plastic clamshells (if locally accepted)"
    prep_steps:
      - "Empty out all remaining liquids and rinse food residue."
      - "Keep caps and lids screwed on tightly to avoid loss during sorting."
      - "Remove non-recyclable spray pumps or plastic wrap labels."
    contamination_guidance:
      - "Do NOT put soft plastic bags, shrink wrap, chip packets, or bubble wrap in curbside bins (they jam sorting conveyors)."
      - "No styrofoam/expanded polystyrene (#6), plastic straws, or disposable cutlery."
      - "Never bag recyclables—place all plastic items loose in the bin."
    local_acceptance: "Curbside programs almost universally accept rigid plastics #1 (PET) and #2 (HDPE). Plastics #3 (PVC), #4 (LDPE), #5 (PP), and #7 (other) depend on local MRF optical sorting equipment."

  paper:
    name: "Paper & Cardboard"
    category: "paper"
    recyclability_class: "Recyclable"
    bin: "Blue Recycling Bin (Mixed Paper & Fiber)"
    badge_color: "amber"
    examples:
      - "Corrugated cardboard boxes & shipping cartons"
      - "Newspapers, magazines, and flyers"
      - "Clean office printer paper & mail"
      - "Paperboard cereal and pantry boxes"
      - "Paper towel rolls & clean brown grocery bags"
    prep_steps:
      - "Ensure all paper and cardboard are clean, dry, and free of food grease."
      - "Flatten all corrugated cardboard boxes to conserve bin space."
      - "Remove plastic shipping tape, bubble inserts, or wax liners."
    contamination_guidance:
      - "Greasy pizza box bottoms, used napkins, paper towels, and sanitary tissues are contaminated and belong in compost or general waste."
      - "Thermal receipts contain BPA/BPS and must NOT be recycled."
      - "Wax-coated or foil-lined beverage cartons require specialized hydropulping."
    local_acceptance: "Widely accepted curbside. Dry clean fiber is baled and pulped up to 5–7 times to create new paperboard and newsprint."

  metal:
    name: "Metal"
    category: "metal"
    recyclability_class: "Recyclable"
    bin: "Blue Recycling Bin (Metals & Cans)"
    badge_color: "slate"
    examples:
      - "Aluminum beverage and soda cans"
      - "Tin and steel food cans (soup, tuna, pet food)"
      - "Clean aluminum pie pans & baking trays"
      - "Clean aluminum foil (balled up)"
      - "Metal jar lids and bottle caps"
    prep_steps:
      - "Empty and rinse beverage and food cans."
      - "Push tin can lids inside the can or detach carefully."
      - "Scrunch aluminum foil into a firm ball at least 2 inches (5 cm) wide so automated sorting screens capture it."
    contamination_guidance:
      - "Pressurized aerosol cans with leftover product are hazardous (recycle only when completely empty)."
      - "Do NOT put scrap metal wires, coat hangers, metal pipes, or electronics in curbside bins."
      - "No paint cans with wet paint residues."
    local_acceptance: "Metals have infinite recyclability without quality loss. Aluminum and ferrous steel are automatically separated via eddy-current separators and industrial magnets."

  glass:
    name: "Glass"
    category: "glass"
    recyclability_class: "Recyclable"
    bin: "Blue Recycling Bin or Dedicated Glass Drop-Off"
    badge_color: "teal"
    examples:
      - "Clear, green, and amber beverage bottles"
      - "Glass food jars (pasta sauce, jam, condiments)"
      - "Cosmetic & skincare glass containers (cleaned)"
    prep_steps:
      - "Empty out contents and give a quick rinse."
      - "Remove metal or plastic lids and recycle them in their respective streams."
      - "Paper labels can remain attached; they burn off during high-temperature kiln remelting."
    contamination_guidance:
      - "Do NOT place broken window glass, mirrors, Pyrex cookware, ceramics, porcelain, or light bulbs in glass recycling (they have different chemical formulations and melting temperatures)."
      - "Never place broken container glass loose in the bin if it poses laceration risks to collection staff."
    local_acceptance: "100% recyclable indefinitely. Some municipalities require separate glass caddies or neighborhood drop-off igloos to prevent glass shards from contaminating paper bales."

  organic:
    name: "Organic Waste"
    category: "organic"
    recyclability_class: "Compostable"
    bin: "Green Organics / Compost Bin"
    badge_color: "emerald"
    examples:
      - "Fruit and vegetable peels, cores, and scraps (banana peels, citrus, apple cores)"
      - "Coffee grounds, unbleached filters, and tea bags (plastic-free)"
      - "Eggshells and nut shells"
      - "Yard waste: leaves, grass clippings, weeds, small plant trimmings"
      - "Food-soiled paper napkins and shredded unprinted cardboard"
    prep_steps:
      - "Remove all plastic PLU produce stickers, twist ties, and rubber bands."
      - "Separate organic food matter from any plastic wrapping or packaging."
      - "Drain excess liquids into the sink before placing solids in the kitchen caddy."
    contamination_guidance:
      - "No plastic bags, plastic wrap, or conventional packaging."
      - "Check local rules regarding cooked meat, bones, and dairy (accepted in industrial aerobic/anaerobic digesters, but avoided in backyard worm bins)."
      - "Only certified BPI/EN 13432 compostable liners if permitted locally."
    local_acceptance: "Organic waste diversion prevents anaerobic decomposition in landfills, directly eliminating fugitive methane emissions and generating nutrient-rich humus for soil regeneration."

# Special waste safety streams
special_waste_streams:
  batteries:
    name: "Batteries (Alkaline, Lithium-Ion, Rechargeable, Car)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Designated Battery Recycling Drop-Off / Retail Take-Back / Municipal HHW Kiosk"
    warning: "FIRE & TOXICITY HAZARD: Never throw batteries in curbside recycling or trash. Lithium-ion batteries ignite under compaction in garbage trucks and recycling sorting facilities."
    safe_handling:
      - "Tape the positive terminals (+ terminal or contact points) with clear electrical or duct tape to prevent short circuits."
      - "Store spent batteries in a cool, dry, non-conductive plastic container until drop-off."
      - "Never puncture, crush, or disassemble damaged or swollen battery cells."
    local_acceptance: "Many hardware stores (Home Depot, Lowe's), electronics retailers (Best Buy), and municipal drop-offs accept household batteries free of charge under stewardship programs (e.g., Call2Recycle)."

  electronic_waste:
    name: "Electronic Waste (E-Waste, Old Mobile Phones, Laptops, Chargers)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Certified E-Waste Recycling Depot / Retail Electronics Take-Back / Community E-Waste Drive"
    warning: "DATA PRIVACY & HEAVY METALS: Contains recoverable gold, silver, and copper alongside lead, cadmium, and brominated flame retardants. Never discard in curbside bins."
    safe_handling:
      - "Perform a factory reset and remove SIM/microSD memory cards to protect your personal data."
      - "Keep rechargeable lithium batteries installed inside device or detached and taped if removable."
      - "Bundle detachable cables and power adapters together."
    local_acceptance: "Accepted at municipal e-waste depots, electronics retailers, and authorized refurbishment centers under WEEE/R2/e-Stewards certified recycling standards."

  expired_medicines:
    name: "Expired & Unused Medicines (Pills, Liquids, Ointments)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Authorized Pharmacy Drug Take-Back Kiosk / National Drug Take-Back Day / Police Station Drop-Box"
    warning: "ENVIRONMENTAL & DRUG SAFETY HAZARD: Never flush medications down the toilet or pour down drains. Wastewater treatment plants cannot remove active pharmaceuticals, poisoning waterways and aquatic life."
    safe_handling:
      - "Leave pills in original child-proof prescription containers with personal patient info blacked out with permanent marker."
      - "Keep liquids sealed in leak-proof bags."
      - "If no take-back program exists, mix uncrushed pills with undesirable substance (used coffee grounds, kitty litter), seal in a container, and place in household trash."
    local_acceptance: "Most major retail pharmacies (CVS, Walgreens, hospital outpatient pharmacies) provide secure drop-boxes in store lobbies year-round."

  hazardous_chemicals:
    name: "Hazardous Chemicals & Paint Residues (Solvents, Motor Oil, Pesticides, Bleach)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Municipal Household Hazardous Waste (HHW) Collection Facility / Scheduled HazMat Event"
    warning: "SEVERE HEALTH, FLAMMABILITY & GROUNDWATER DANGER: Corrosive, flammable, and poisonous. Liquid chemicals poured down storm drains or placed in curbside bins contaminate drinking water and endanger sanitation crews."
    safe_handling:
      - "Keep chemicals in their original labeled containers whenever possible."
      - "Never mix chemical products together (mixing bleach and ammonia produces lethal chloramine gas)."
      - "Transport containers upright and secured in a sturdy cardboard box or secondary plastic tray."
    local_acceptance: "Municipalities host dedicated HHW drop-off sites or seasonal mobile collection events. Latex paint can be dried with paint hardener or kitty litter and disposed of as solid waste in some areas."

  sanitary_pads:
    name: "Sanitary Pads, Tampons, Diapers & Incontinence Products"
    category: "special_waste"
    recyclability_class: "Non-recyclable"
    recommended_collection: "Black / Gray General Waste Bin (Solid Sanitary Landfill or High-Temp Waste-to-Energy)"
    warning: "BIOHAZARD & SEWER BLOCKAGE: Never flush sanitary pads, tampons, or wet wipes down the toilet. They cause severe 'fatberg' blockages in plumbing and municipal sewer mains."
    safe_handling:
      - "Wrap used pads or diapers securely in toilet paper, paper towels, or designated disposal wrapper."
      - "Place inside a lined waste bin with a secure lid."
      - "Wash hands thoroughly with soap and water after disposal."
    local_acceptance: "Sanitary hygiene products are classified as non-recyclable residual municipal solid waste and are routed to sanitary landfills or waste-to-energy incineration facilities."

  broken_glass:
    name: "Broken Glass (Mirrors, Window Panes, Drinking Tumblers, Pyrex)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "General Waste Bin (Thickly Wrapped & Marked) or Specialized C&D Facility"
    warning: "LACERATION HAZARD TO WORKERS: Never put broken non-container glass in curbside glass recycling bins. Ceramics, window glass, and Pyrex have higher melting points and ruin container glass remelt batches."
    safe_handling:
      - "Wrap broken glass shards in multiple layers of heavy newspaper, or place inside an empty puncture-proof cardboard box or rigid plastic jug."
      - "Seal all edges securely with heavy-duty packaging duct tape."
      - "Clearly write 'SHARP: BROKEN GLASS' on the outside so waste handlers avoid injury."
    local_acceptance: "Window glass, mirrors, and tableware cannot be accepted at container glass facilities; they belong in general waste once wrapped securely."

  fluorescent_tubes:
    name: "Fluorescent Tubes, CFL Bulbs & Mercury Lamps"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Hardware Store Light Bulb Drop-Off / Municipal Hazardous Waste Facility"
    warning: "MERCURY POISONING RISK: Fluorescent tubes and compact fluorescent lamps (CFLs) contain toxic elemental mercury vapor that disperses into the air when crushed in trash trucks."
    safe_handling:
      - "Handle gently to prevent tube breakage."
      - "If broken: evacuate the room for 15 minutes, ventilate, scoop glass and phosphor powder with stiff cardboard (do NOT vacuum, which atomizes mercury), and seal in a glass jar."
      - "Transport unbroken tubes in original sleeves or bubble wrap."
    local_acceptance: "Accepted at major home improvement retailers (Home Depot, IKEA, Lowe's) and all municipal HHW drop-off depots."

  construction_debris:
    name: "Construction & Demolition Debris (Concrete, Drywall, Scrap Lumber, Tile)"
    category: "special_waste"
    recyclability_class: "Special handling"
    recommended_collection: "Authorized Construction & Demolition (C&D) Recycling Facility / Rented Roll-Off Dumpster"
    warning: "BIN OVERLOAD & INERT WASTE: Curbside household bins cannot sustain the weight of bricks, concrete, and soil; heavy debris damages automated truck lifting arms."
    safe_handling:
      - "Separate clean untreated lumber, scrap drywall, and masonry into distinct piles for specialized recyclers."
      - "Inspect pre-1980 building materials for asbestos or lead-based paint hazards before disturbing."
      - "Arrange a dedicated roll-off dumpster or transport to a licensed transfer station."
    local_acceptance: "C&D facilities crush concrete and brick into road aggregate base and chip clean lumber into landscaping mulch."

